<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bosses N Baddies - Unchained</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .hero-container { max-width: 1000px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; background: #1e293b; padding: 40px; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); border: 1px solid #334155; }
        .hero-text { display: flex; flex-direction: column; justify-content: center; }
        h1 { font-size: 3.5rem; font-weight: 800; line-height: 1.1; margin-bottom: 20px; background: linear-gradient(to right, #38bdf8, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #94a3b8; font-size: 1.2rem; line-height: 1.6; margin-bottom: 30px; }
        .btn-group { display: flex; gap: 15px; }
        .btn { display: inline-block; padding: 14px 28px; font-size: 1rem; font-weight: 600; text-decoration: none; border-radius: 12px; text-align: center; transition: all 0.2s; }
        .btn-primary { background: #a855f7; color: white; box-shadow: 0 4px 14px rgba(168, 85, 247, 0.4); }
        .btn-primary:hover { background: #9333ea; transform: translateY(-2px); }
        .btn-secondary { background: transparent; color: #cbd5e1; border: 2px solid #475569; }
        .btn-secondary:hover { border-color: #64748b; background: rgba(255,255,255,0.05); transform: translateY(-2px); }
        
        /* The Visual AI Showcase Screen */
        .video-box { background: #0f172a; border-radius: 16px; border: 2px solid #475569; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; min-height: 350px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.6); }
        .video-placeholder { text-align: center; padding: 20px; }
        .glow-dot { width: 12px; height: 12px; background: #38bdf8; border-radius: 50%; display: inline-block; animation: pulse 2s infinite; margin-bottom: 10px; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); } }
        @media(max-width: 768px) { .hero-container { grid-template-columns: 1fr; } h1 { font-size: 2.5rem; } }
    </style>
</head>
<body>

<div class="hero-container">
    <div class="hero-text">
        <h1>UNCHAINED</h1>
        <p>Welcome to the premium collective. Unlock your customizable 3D/2D AI Avatar experiences and sync your elite $15/month cannabis membership platform cleanly from one unified dashboard.</p>
        <div class="btn-group">
            <a href="/login.html" class="btn btn-primary">Sign In</a>
            <a href="/register.html" class="btn btn-secondary">Join Now</a>
        </div>
    </div>
    
    <!-- Visual Screen Component -->
    <div class="video-box">
        <div class="video-placeholder">
            <span class="glow-dot"></span>
            <h3 style="color: #f1f5f9; margin-bottom: 8px;">AI Boo Live Stream Feed</h3>
            <p style="font-size: 0.9rem; color: #64748b;">[ Video preview loading... System status: Active ]</p>
        </div>
    </div>
</div>

</body>
</html>
